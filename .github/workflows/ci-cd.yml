
# Name displayed in the GitHub Actions tab.
name: Observability Demo CI/CD

# Run when code is pushed to main or a PR targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions required for repository checkout and package publishing.
permissions:
  contents: read
  packages: write

# Both jobs must be defined under jobs.
jobs:
  # Job 1: test the application and build the Docker image.
  test-and-build:
    # GitHub provides a temporary Ubuntu machine.
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Python for running FastAPI tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install application dependencies and testing tools.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # Execute automated API tests.
      - name: Run tests
        run: pytest -v

      # Build the Docker image without publishing it yet.
      - name: Build Docker image
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # Job 2: publish the image only if the first job succeeds.
  publish-image:
    needs: test-and-build
    runs-on: ubuntu-latest

    # Publish only on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Download the source code.
      - name: Check out repository
        uses: actions/checkout@v4

      # Convert the repository name to lowercase for Docker.
      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Set up Docker image building.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish two image tags after tests pass.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
